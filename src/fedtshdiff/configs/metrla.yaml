# METR-LA: paper Section 5.3 (64/64, stride 32, 100-1000 windows, up to 60 sensors).
# The paper used a random split; with stride 32 < window 128, random splitting places
# overlapping windows in train and test.  The revision defaults to the leakage-free time split
# (set split: random to reproduce the submitted protocol).
dataset: metrla
past_len: 64
future_len: 64
max_clients: 60
split: time
test_ratio: 0.2
val_ratio: 0.1
diffusion_steps: 200
ddim_steps: 200
rounds: 250
local_epochs: 4
batch_size: 32
lr: 1.0e-4
num_edges: 2
descriptor: signal
grouping: balance
select_form: softmax
a_sel: 10.0
b_sel: 0.0
tau_sel: 1.0
agg_form: exp
alpha_agg: 1.0
beta_agg: 1.0
