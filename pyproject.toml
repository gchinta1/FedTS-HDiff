[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedtshdiff"
version = "2.0.0"
description = "Revision experiment code base for FedTS-HDiff (hierarchical federated diffusion forecasting)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "h5py>=3.8",
  "wfdb>=4.1",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fedts = "fedtshdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fedtshdiff = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: end-to-end tests that take more than a few seconds",
  "gpu: tests that need a CUDA device",
]
